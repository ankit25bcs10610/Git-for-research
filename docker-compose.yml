version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://research:research@postgres:5432/research
    depends_on:
      - postgres

  crdt-relay:
    build: ./crdt-relay
    ports:
      - "1234:1234"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
